services:
  postgres:
    image: postgres:16-alpine
    container_name: artiverse-postgres
    environment:
      POSTGRES_USER: artiverse_user
      POSTGRES_PASSWORD: artiverse_password_dev
      POSTGRES_DB: artiverse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artiverse_user -d artiverse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artiverse-network

  minio:
    image: minio/minio
    container_name: artiverse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    networks:
      - artiverse-network

  # One-shot job: create the bucket and make it publicly readable
  createbuckets:
    image: minio/mc
    container_name: artiverse-createbuckets
    depends_on:
      - minio
    networks:
      - artiverse-network
    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...' && sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/artiverse-media;
        /usr/bin/mc anonymous set download local/artiverse-media;
        echo 'minio bucket ready';
      "

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: artiverse-backend
    environment:
      DATABASE_URL: postgresql://artiverse_user:artiverse_password_dev@postgres:5432/artiverse
      SECRET_KEY: your-secret-key-change-in-production-12345678
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEBUG: "True"
      ENVIRONMENT: development
      # Image storage via MinIO (S3-compatible)
      STORAGE_BACKEND: s3
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: artiverse-media
      # Endpoint used by the backend (inside the docker network)
      S3_ENDPOINT_URL: http://minio:9000
      # Public base URL returned to the browser (reachable from the host)
      S3_PUBLIC_URL: http://localhost:9000/artiverse-media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ./back-end:/app
    networks:
      - artiverse-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Starting FastAPI server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile.dev
    container_name: artiverse-frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://backend:8000/api/v1
      BACKEND_URL: http://backend:8000
      NODE_ENV: development
      NUXT_IGNORE_LOCK: 1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./front-end:/app
      - /app/node_modules
    networks:
      - artiverse-network
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  artiverse-network:
    driver: bridge
