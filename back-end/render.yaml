services:
  - type: web
    name: artiverse-backend
    runtime: python
    plan: free
    rootDir: back-end
    buildCommand: pip install -r requirements/base.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: ALLOWED_ORIGINS
        sync: false
