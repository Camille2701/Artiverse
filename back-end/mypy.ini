[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

# Ignore missing imports for third-party libraries without type stubs
ignore_missing_imports = True

# Warn about unused ignores
warn_unused_ignores = False

# Show error codes
show_error_codes = True

# Pretty print errors
pretty = True

# Follow imports for stubs
follow_imports = normal

# Disable strict checking by default
no_implicit_optional = False
strict_optional = False

# Exclude files that are too problematic for mypy
exclude = (
    "app/seed.py",
    "app/import_media.py",
)

# Per-module options - disable most checks for app modules
[mypy-app.models.*]
ignore_errors = True

[mypy-app.services.*]
ignore_errors = True

[mypy-app.api.*]
ignore_errors = True

[mypy-app.dependencies.*]
ignore_errors = True

[mypy-app.db.*]
ignore_errors = True

[mypy-app.utils.*]
ignore_errors = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
