[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
ignore_missing_imports = True
warn_unused_ignores = False
show_error_codes = False
pretty = True
follow_imports = normal
no_implicit_optional = False
strict_optional = False
exclude = (?x)(
    app/seed.py
    | app/import_media.py
    )

[mypy-app.models.*]
ignore_errors = True

[mypy-app.services.*]
ignore_errors = True

[mypy-app.api.*]
ignore_errors = True

[mypy-app.dependencies.*]
ignore_errors = True

[mypy-app.db.*]
ignore_errors = True

[mypy-app.utils.*]
ignore_errors = True
